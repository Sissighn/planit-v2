name: planit

services:
  backend:
    image: planit-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PLANIT_DATABASE_PATH: /app/data/planit_db
    volumes:
      - planit-data:/app/data
    ports:
      - "127.0.0.1:${PLANIT_API_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: planit-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PLANIT_WEB_PORT:-3000}:80"
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  planit-data:
    name: planit-data
