server:
  port: 8080

planit:
  database:
    path: ${PLANIT_DATABASE_PATH:./data/planit_db}

spring:
  datasource:
    url: jdbc:h2:file:${planit.database.path};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  main:
    banner-mode: "off"
logging:
  level:
    root: INFO
